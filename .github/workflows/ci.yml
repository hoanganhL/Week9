name: Java CI/CD Maven Workflow

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
permissions:
    contents: read
    pull-requests: write
    checks: write

jobs:
  build:
      strategy:
        fail-fast: false
        matrix:
          os: [ ubuntu-latest, windows-latest, macos-latest ]
      runs-on: ${{ matrix.os }}

      steps:

       - name: Checkout repository code
         uses: actions/checkout@v4

       - name: Set up JDK 17 with Maven Cache
         uses: actions/setup-java@v4
         with:
           java-version: '17'
           distribution: 'temurin'
           cache: 'maven'
           cache-dependency-path: 'Bai 9.2/pom.xml'

       - name: Run Unit Tests
         working-directory: ./Bai 9.2
         run: mvn test

       - name: Package Application
         working-directory: ./Bai 9.2
         run: mvn package

       - name: Upload JAR Artifact
         uses: actions/upload-artifact@v4
         with:
           name: math-utils-app-jar
           path: Bai 9.2/target/*.jar
           retention-days: 7

       - name: Run Maven Verify & JaCoCo Coverage Check
         working-directory: ./Bai 9.2
         run: mvn clean verify
                               

       - name: Upload JaCoCo Coverage Report
         if: always()
         uses: actions/upload-artifact@v4
         with:
           name: jacoco-coverage-report
           path: Bai 9.2/target/site/jacoco/
           retention-days: 7

       - name: Checkstyle Inline Review
         if: failure() || always()
         uses: dbelyaev/action-checkstyle@v1.4
         with:
           github_token: ${{ secrets.GITHUB_TOKEN }}
           reporter: github-pr-review
           level: warning
           workdir: Bai 9.2
